# Release: pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) builds the Windows installer and creates a DRAFT GitHub release.
# Nothing here publishes a release. Pim reviews the draft and publishes it by hand (see RELEASING.md).
# Secrets used: LEAK_DENYLIST (required), and for signing through Microsoft's Azure signing service (Artifact Signing,
# formerly Trusted Signing), all seven of: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGN_ENDPOINT,
# AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER.
# The release job runs in the protected environment `release` (Pim approves every run); the Azure secrets are environment secrets.
# With none of the seven set the build continues UNSIGNED, loudly. With only some set, the run fails.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: read only by default. Only the release job may write (to create the draft).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Checks before building
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Tag must match the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.js "$TAG"
      - name: Tagged commit must be on main
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error title=Tag is not on main::The tagged commit is not part of main. Release tags must point at a commit on main."
            exit 1
          fi
      - name: Write the deny-list from the secret
        id: deny
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "${LEAK_DENYLIST//[[:space:]]/}" ]; then
            echo "::error title=Deny-list missing::The LEAK_DENYLIST secret is empty or not set. A release must never be built without the leak scan."
            exit 1
          fi
          file="$(node scripts/ci-denylist.js write)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Scan the tracked files
        env:
          DENYLIST_FILE: ${{ steps.deny.outputs.file }}
        run: node scripts/check-secrets.js --all --require-denylist --denylist "$DENYLIST_FILE"
      - name: Scan the history
        env:
          DENYLIST_FILE: ${{ steps.deny.outputs.file }}
        run: node scripts/check-secrets.js --history --require-denylist --denylist "$DENYLIST_FILE"
      - name: Remove the deny-list file
        if: always()
        run: node scripts/ci-denylist.js delete

  release:
    name: Build the installer and create the draft
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    # Protected environment "release": required reviewer is Pim, so every run waits for his approval after the gate passes.
    # The Azure signing secrets are environment secrets here. LEAK_DENYLIST stays a repository secret (also visible here).
    environment: release
    permissions:
      contents: write # create the draft release and upload its files
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      # Pinned version of the PowerShell module that electron-builder uses to sign (checked against the PowerShell Gallery:
      # 0.5.8 is the newest stable one). Change it here on purpose, never to "latest".
      TRUSTED_SIGNING_VERSION: "0.5.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Run the tracked tests (scripts/*.test.js)
        run: node --test scripts/*.test.js
      - name: Decide whether to sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # Only whether the client secret exists is passed here, never its value. The value goes to the build step alone.
          AZURE_CLIENT_SECRET_SET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          # A workflow cannot test a secret in `if:`, so test the values here. Only names are ever printed, never values.
          names=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER)
          missing=()
          for n in "${names[@]}"; do
            if [ "$n" = AZURE_CLIENT_SECRET ]; then
              [ "$AZURE_CLIENT_SECRET_SET" = "true" ] || missing+=("$n")
              continue
            fi
            v="${!n}"
            [ -n "${v//[[:space:]]/}" ] || missing+=("$n")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "### Signing ON (Azure signing service)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${#missing[@]}" -eq "${#names[@]}" ]; then
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning title=UNSIGNED BUILD::No Azure signing secrets are set, so this installer is NOT signed. Windows will show Unknown publisher and Smart App Control may block it. Do not publish this draft unless an unsigned release is intended."
            {
              echo "## :warning: UNSIGNED BUILD"
              echo "No Azure signing secrets are set, so this installer is **not signed**. Do not publish the draft unless that is intended."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Signing is half configured::These signing secrets are missing: ${missing[*]}. Set all seven or none."
            exit 1
          fi
      - name: Install the signing module (pinned version)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          # electron-builder signs through the PowerShell module TrustedSigning. Install an exact version before it runs, so the
          # build never fetches whatever is newest. No secret is needed (or passed) in this step.
          Install-Module -Name TrustedSigning -RequiredVersion $env:TRUSTED_SIGNING_VERSION -Scope CurrentUser -Repository PSGallery -Force -AcceptLicense
          $m = Get-Module -ListAvailable -Name TrustedSigning | Where-Object { $_.Version -eq [version]$env:TRUSTED_SIGNING_VERSION }
          if (-not $m) { Write-Host "::error title=Signing module::TrustedSigning $env:TRUSTED_SIGNING_VERSION is not installed."; exit 1 }
          Write-Host "TrustedSigning $($m.Version) installed."
      - name: Build the installer (not published by electron-builder)
        env:
          CI: "true"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          args=()
          if [ "$HAS_SIGNING" = "true" ]; then
            # forceCodeSigning makes electron-builder fail if signing does not work, so a wrong secret cannot give a green run
            # with an unsigned file. The credentials (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) are read from the
            # environment by the signing module. The names below come from secrets, so none are in the repo.
            args+=(
              "-c.forceCodeSigning=true"
              "-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER"
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            )
          fi
          npm run dist:win -- --publish never "${args[@]}"
      - name: Check the signature
        shell: pwsh
        env:
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          $mode = if ($env:HAS_SIGNING -eq 'true') { 'signed' } else { 'unsigned' }
          $version = $env:TAG.TrimStart('v')
          # Every .exe the installer build produces: the installer(s) in dist/ and the executables directly in dist/win-unpacked
          # (not the third-party ones deep inside node_modules, which are not ours to sign). The two we know must be among them.
          $files = @(Get-ChildItem -LiteralPath dist -Filter *.exe -File) + @(Get-ChildItem -LiteralPath dist/win-unpacked -Filter *.exe -File)
          foreach ($need in @("Pi-Crust-Setup-$version.exe", 'Pi Crust.exe')) {
            if (-not ($files | Where-Object { $_.Name -eq $need })) { Write-Host "::error title=Missing build output::$need was not produced."; exit 1 }
          }
          Write-Host "Checking $($files.Count) executables."
          foreach ($f in $files) {
            & ./scripts/verify-signature.ps1 -File $f.FullName -Mode $mode -Publisher $env:AZURE_SIGN_PUBLISHER
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Check the installer name
        run: |
          VERSION="${TAG#v}"
          for f in "Pi-Crust-Setup-$VERSION.exe" "Pi-Crust-Setup-$VERSION.exe.blockmap" latest.yml; do
            test -f "dist/$f" || { echo "::error title=Missing build output::dist/$f was not produced."; exit 1; }
          done
          grep -q "Pi-Crust-Setup-$VERSION.exe" dist/latest.yml || { echo "::error title=latest.yml mismatch::latest.yml does not name the installer."; exit 1; }
      - name: Write the deny-list from the secret
        id: deny
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "${LEAK_DENYLIST//[[:space:]]/}" ]; then
            echo "::error title=Deny-list missing::The LEAK_DENYLIST secret is empty or not set."
            exit 1
          fi
          file="$(node scripts/ci-denylist.js write)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Scan the unpacked build
        env:
          DENYLIST_FILE: ${{ steps.deny.outputs.file }}
        run: node scripts/scan-unpacked.js dist/win-unpacked "$DENYLIST_FILE"
      - name: Checksums (after any signing, so they match the uploaded file)
        run: node scripts/checksums.js dist
      - name: Release notes
        env:
          DENYLIST_FILE: ${{ steps.deny.outputs.file }}
        run: |
          VERSION="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo '> **UNSIGNED BUILD.** This installer is not signed. Windows will show "Unknown publisher" and Smart App Control may block it. Do not publish this draft unless an unsigned release is intended, and delete this line first.' >> "$notes"
            printf '\n' >> "$notes"
          fi
          node scripts/release-notes.js "$VERSION" >> "$notes"
          printf '\n' >> "$notes"
          node scripts/checksums.js --notes dist >> "$notes"
          node scripts/check-secrets.js --file "$notes" --require-denylist --denylist "$DENYLIST_FILE"
          echo "notes=$notes" >> "$GITHUB_ENV"
      - name: Remove the deny-list file
        if: always()
        run: node scripts/ci-denylist.js delete
      - name: Create the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          flags=(--draft --verify-tag --title "Pi Crust $VERSION" --notes-file "$notes")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          # gh prints the URL of the new release as the last line. `gh release view <tag>` can miss a draft, so the draft is
          # confirmed through the API by listing releases (drafts included) and matching the tag.
          created="$(gh release create "$TAG" "${flags[@]}" \
            "dist/Pi-Crust-Setup-$VERSION.exe" \
            "dist/Pi-Crust-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            dist/SHA256SUMS.txt | tail -n 1)"
          echo "gh release create said: $created"
          url="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .html_url" | head -n 1)"
          test -n "$url" || { echo "::error title=Not a draft::No draft release for $TAG was found after creating it."; exit 1; }
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .html_url" | head -n 1)"
          test -z "$published" || { echo "::error title=Published release exists::A published release for $TAG exists. It must be a draft only."; exit 1; }
          echo "### Draft release created (NOT published)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft: $url"
